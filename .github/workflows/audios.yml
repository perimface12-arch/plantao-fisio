name: Gerar áudios narrados

on:
  push:
    branches: [main]
    paths: ["cases.js", "tools/**", ".github/workflows/audios.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: audios
  cancel-in-progress: false

jobs:
  audios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar voz neural
        run: pip install edge-tts
      - name: Extrair textos dos casos
        run: node tools/extrair-textos.js > tools/textos.json
      - name: Gravar áudios
        run: python tools/gerar_audios.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Áudios narrados atualizados"
          git pull --rebase origin main
          git push
      - name: Atualizar o site
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
