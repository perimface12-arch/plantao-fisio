<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Plantão Fisio</title>
<meta name="description" content="Simulador de casos de fisioterapia hospitalar com resposta por voz.">
<meta name="theme-color" content="#0A1517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plantão Fisio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Monitor multiparamétrico de UTI: fundo de tela de monitor, cada parâmetro na sua cor clínica. */
:root{
  --bg:#0A1517; --panel:#101F22; --panel2:#152A2E; --line:#1F3A3F;
  --fg:#E7F1EF; --muted:#8FA9A6; --dim:#5D7774;
  --hr:#58E08A; --spo2:#3CD3F0; --fr:#F4CF4A; --pa:#FF7E7E;
  --accent:#3CD3F0; --accent-ink:#04252C; --xp:#F6C453;
  --ok:#58E08A; --warn:#F4B13D; --bad:#FF6B6B;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:600px){body{background:radial-gradient(1200px 600px at 50% -10%,#123036 0%,var(--bg) 60%)}}
.screen{display:flex;flex-direction:column;gap:18px;padding-block:14px 140px;flex:1}
.label{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px} h2{font-size:26px} h3{font-size:21px}
p{margin:0}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font:700 22px/1 var(--display);letter-spacing:.02em}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

/* player card */
.player{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.player-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rank{font:700 24px/1 var(--display)}
.xpnum{font:700 30px/1 var(--display);color:var(--xp);font-variant-numeric:tabular-nums}
.xpnum small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#d79b23,var(--xp));border-radius:99px;transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* level cards */
.levels{display:grid;gap:12px}
.level{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:grid;gap:10px;overflow:hidden}
.level::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.level[data-l="iniciante"]{--c:var(--hr)} .level[data-l="intermediario"]{--c:var(--fr)} .level[data-l="especialista"]{--c:var(--pa)}
.level-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pips{display:flex;gap:4px} .pips i{width:18px;height:6px;border-radius:2px;background:var(--line)} .pips i.on{background:var(--c)}
.level p{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.segs i{height:5px;border-radius:2px;background:var(--line)} .segs i.on{background:var(--c)}
.level-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.go{font:600 14px/1 var(--body);color:var(--c);display:flex;align-items:center;gap:6px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:grid;gap:6px;justify-items:center}
.badge svg{width:30px;height:30px}
.badge b{font:600 12px/1.2 var(--body)}
.badge.off{opacity:.35;filter:grayscale(1)}

/* journey */
.backrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}
.hearts{display:flex;gap:4px}
.hearts svg{width:22px;height:22px}
.combo{font:700 15px/1 var(--display);color:var(--xp);letter-spacing:.04em}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.brief p{color:#cfe0dd}
.chipbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:500;justify-self:start}
.chipbtn svg{width:18px;height:18px}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.path{display:grid;gap:0;position:relative}
.node{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 0;position:relative}
.node .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);font:700 18px/1 var(--display);position:relative;z-index:1}
.node:not(:last-child)::before{content:"";position:absolute;left:21px;top:54px;bottom:-10px;width:2px;background:var(--line)}
.node.done .dot{background:var(--c);border-color:var(--c);color:#06201A}
.node.done:not(:last-child)::before{background:var(--c)}
.node.cur .dot{border-color:var(--c);color:var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent)}
.node.lock{opacity:.45}
.node b{display:block;font:600 15px/1.25 var(--body)}
.node span{font-size:13px;color:var(--muted)}
.node .boss{font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--pa);border:1px solid var(--pa);border-radius:4px;padding:3px 5px}

/* case monitor */
.monitor{background:#050C0D;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mon-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #12262A;font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.06em}
.mon-head .live{display:flex;align-items:center;gap:6px;color:var(--hr)}
.mon-head .live i{width:7px;height:7px;border-radius:50%;background:var(--hr);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.wave{display:block;width:100%;height:56px}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #12262A}
.vital{padding:8px 10px;border-right:1px solid #12262A;min-width:0}
.vital:last-child{border-right:0}
.vital .label{font-size:10px;color:var(--vc);opacity:.85}
.vital b{display:block;font:600 30px/1 var(--display);color:var(--vc);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.vital.pa b{font-size:22px;margin-top:8px}
.extra{padding:8px 12px;border-top:1px solid #12262A;font:500 12px/1.3 var(--mono);color:var(--muted)}
.casehead{display:grid;gap:4px}
.tagline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.tag.boss{color:var(--pa);background:color-mix(in srgb,var(--pa) 14%,transparent)}
.situ{color:#d6e5e2;font-size:16px}
.ask{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px;font:600 17px/1.4 var(--body)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:color-mix(in srgb,var(--xp) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--xp) 35%,transparent);border-radius:10px;padding:12px 14px;font-size:15px}
.answer{display:grid;gap:8px}
.answer textarea{width:100%;min-height:120px;resize:vertical;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:16px/1.5 var(--body)}
.answer .interim{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,transparent,var(--bg) 26%);
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:528px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{flex:1;min-height:56px;border-radius:16px;font:600 17px/1 var(--body);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);flex:0 0 auto}
.btn:disabled{opacity:.5}
.mic{background:var(--accent);color:var(--accent-ink)}
.mic.rec{background:var(--bad);color:#2A0505;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.55)}70%{box-shadow:0 0 0 16px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,8,9,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.verdict{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 24px/1 var(--display)}
.verdict h2{color:var(--vc)}
.xpgain{font:700 20px/1 var(--display);color:var(--xp)}
.feedback{font-size:16px;color:#d9e7e4}
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;align-items:start}
.li svg{width:18px;height:18px;margin-top:2px}
.gab{background:var(--panel2);border-radius:12px;padding:14px;display:grid;gap:8px;font-size:15px}
.gab .ref{font-size:12px;color:var(--muted)}
.sheet .actions{display:grid;gap:10px}
.field{display:grid;gap:6px}
.field input,.field select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;font:16px var(--body);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted)}
.ecgload{width:90px;height:30px}
.done-hero{text-align:center;display:grid;gap:10px;justify-items:center;padding-top:20px}
.done-hero svg.big{width:96px;height:96px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--xp);color:var(--fg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;max-width:90%}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<canvas id="confetti" hidden></canvas>

<script src="cases.js"></script>
<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");
const isAndroid = /android/i.test(navigator.userAgent);
const J = window.JORNADAS;

const ICON = {
  heart: f => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="${f ? "#FF6B6B" : "none"}" stroke="${f ? "#FF6B6B" : "#3a5257"}" stroke-width="1.8"/></svg>`,
  mic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`,
  stop: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>`,
  send: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  speaker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`,
  bulb: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>`,
  kb: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`,
  gear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  check: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  minus: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>`,
  x: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`,
  logo: `<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#102B30"/><path d="M4 19h7l2.5-7 4 13 3-9 1.5 3H30" fill="none" stroke="#3CD3F0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};
const BADGE_SVG = (color, path) => `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l11 4.5v8.8c0 7-4.7 12.4-11 14.7C9.7 27.7 5 22.3 5 15.3V6.5z" fill="${color}22" stroke="${color}" stroke-width="1.6"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const BADGES = [
  { id: "primeiro", nome: "Primeiro atendimento", desc: "Acerte o primeiro caso", svg: BADGE_SVG("#3CD3F0", "M11 16l3.5 3.5L21 13") },
  { id: "iniciante", nome: "Enfermaria em ordem", desc: "Conclua a jornada Iniciante", svg: BADGE_SVG("#58E08A", "M10 20V12h12v8M13 12V9h6v3") },
  { id: "intermediario", nome: "VNI na veia", desc: "Conclua a jornada Intermediário", svg: BADGE_SVG("#F4CF4A", "M9 17h4l2-5 3 8 2-3h3") },
  { id: "especialista", nome: "Guardiã do pulmão", desc: "Conclua a jornada Especialista", svg: BADGE_SVG("#FF7E7E", "M16 10v11M16 13c-2-2-5-1-5 3s1 4 5 4M16 13c2-2 5-1 5 3s-1 4-5 4") },
  { id: "impecavel", nome: "Plantão impecável", desc: "Conclua uma jornada sem perder vida", svg: BADGE_SVG("#F6C453", "M16 9l2 4.3 4.6.5-3.4 3.1 1 4.6-4.2-2.4-4.2 2.4 1-4.6-3.4-3.1 4.6-.5z") },
  { id: "chamas", nome: "Em chamas", desc: "5 acertos seguidos", svg: BADGE_SVG("#F4B13D", "M16 22c-3 0-5-2-5-4.5 0-3 3-4 3-7 2 1 3 3 3 4 1-1 1-2 1-3 2 1.5 3 3.5 3 5.5 0 3-2 5-5 5z") },
  { id: "deprimeira", nome: "De primeira", desc: "10 acertos de primeira, sem dica", svg: BADGE_SVG("#B79CFF", "M16 9v14M12 13l4-4 4 4") }
];
const RANKS = [
  [0, "Estagiária"], [300, "Residente R1"], [800, "Residente R2"],
  [1500, "Plantonista"], [2500, "Intensivista"], [3600, "Preceptora"]
];

/* ---------- estado ---------- */
const KEY = "plantao-fisio-v1";
const blank = () => ({ nome: "", xp: 0, acertos: 0, deprimeira: 0, comboMax: 0, badges: [], prog: {}, hearts: {}, concluidas: {}, perdeuVida: {},
  cfg: { apiKey: "", model: "claude-sonnet-5-5", rate: 1, voice: "", autoVoz: true } });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); S.cfg = Object.assign(blank().cfg, S.cfg || {}); } catch (e) { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- voz: narração ---------- */
const TTS = {
  ok: "speechSynthesis" in window,
  speaking: false, queue: [], onEnd: null,
  voice() {
    const vs = speechSynthesis.getVoices().filter(v => /^pt(-|_)?BR/i.test(v.lang) || /portugu[eê]s.*brasil/i.test(v.name));
    if (S.cfg.voice) { const v = speechSynthesis.getVoices().find(v => v.name === S.cfg.voice); if (v) return v; }
    return vs.find(v => /google/i.test(v.name)) || vs.find(v => /luciana|francisca|thalita|maria/i.test(v.name)) || vs[0] || null;
  },
  speak(text, onEnd) {
    if (!this.ok) return;
    this.stop();
    const parts = String(text).replace(/₂/g, "2").replace(/cmH2O/g, "centímetros de água").replace(/SpO2/g, "saturação").replace(/FiO2/g, "F i O 2")
      .match(/[^.!?;:]+[.!?;:]?/g) || [text];
    this.queue = parts.map(p => p.trim()).filter(Boolean);
    this.onEnd = onEnd || null; this.speaking = true; this._next();
  },
  _next() {
    if (!this.queue.length) { this.speaking = false; const f = this.onEnd; this.onEnd = null; f && f(); return; }
    const u = new SpeechSynthesisUtterance(this.queue.shift());
    u.lang = "pt-BR"; u.rate = S.cfg.rate || 1; const v = this.voice(); if (v) u.voice = v;
    u.onend = () => { if (this.speaking) this._next(); };
    u.onerror = () => { if (this.speaking) this._next(); };
    speechSynthesis.speak(u);
  },
  stop() { this.speaking = false; this.queue = []; this.onEnd = null; try { speechSynthesis.cancel(); } catch (e) {} }
};
if (TTS.ok) speechSynthesis.onvoiceschanged = () => {};

/* ---------- voz: reconhecimento ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STT = {
  ok: !!SR, rec: null, on: false, base: "", sess: "", onUpdate: null, onError: null,
  start(onUpdate, onError) {
    if (!SR) { onError && onError("unsupported"); return; }
    TTS.stop();
    this.onUpdate = onUpdate; this.onError = onError; this.on = true; this.sess = "";
    this._spawn();
  },
  _spawn() {
    const r = new SR();
    r.lang = "pt-BR"; r.interimResults = true; r.continuous = !isAndroid; r.maxAlternatives = 1;
    r.onresult = e => {
      let fin = "", inter = "";
      for (let i = 0; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t + " "; else inter += t; }
      this.sess = fin;
      this.onUpdate && this.onUpdate((this.base + " " + fin).trim(), inter);
    };
    r.onerror = e => { if (e.error === "no-speech" || e.error === "aborted") return; this.on = false; this.onError && this.onError(e.error); };
    r.onend = () => {
      this.base = (this.base + " " + this.sess).trim(); this.sess = "";
      if (this.on) { try { this._spawn(); } catch (e) { this.on = false; } }
      else this.onUpdate && this.onUpdate(this.base, "", true);
    };
    this.rec = r;
    try { r.start(); } catch (e) {}
  },
  stop() { this.on = false; try { this.rec && this.rec.stop(); } catch (e) {} },
  reset(t = "") { this.base = t; this.sess = ""; }
};

/* ---------- avaliação ---------- */
function termHit(text, term) {
  const t = norm(term);
  if (t.length <= 3 || /^[\d,.%:/-]+$/.test(t)) {
    const re = new RegExp("(^|[^a-z0-9])" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^a-z0-9])");
    return re.test(text);
  }
  return text.includes(t);
}
function avaliarLocal(caso, resposta) {
  const txt = norm(resposta);
  const acertos = [], faltou = [];
  caso.pontos.forEach(p => (p.k.some(k => termHit(txt, k)) ? acertos : faltou).push(p.t));
  const n = acertos.length, min = caso.minimo;
  const nota = Math.round(Math.min(1, n / caso.pontos.length) * 100);
  const veredito = n >= min ? "correta" : n >= min - 1 && n > 0 ? "parcial" : "incorreta";
  const fb = veredito === "correta"
    ? `Resposta correta. Você cobriu ${n} dos ${caso.pontos.length} pontos-chave.` + (faltou.length ? " Para ficar completa, vale incluir o que aparece abaixo." : "")
    : veredito === "parcial"
      ? `Quase lá. Você trouxe ${n} pontos-chave, mas faltou o que está listado abaixo. Reveja o raciocínio e tente de novo.`
      : `Ainda não. Faltaram pontos essenciais do raciocínio. Veja abaixo o que era esperado e confira o gabarito.`;
  return { veredito, nota, acertos, faltou, erros: [], feedback: fb, fonte: "gabarito" };
}
async function avaliarIA(caso, jornada, resposta, signal) {
  const prompt = `Você é preceptora de fisioterapia hospitalar e intensiva, avaliando a resposta oral de uma fisioterapeuta em um simulado de casos clínicos. A resposta foi transcrita por reconhecimento de voz: ignore erros de transcrição, pontuação e números escritos por extenso, e interprete a intenção clínica.

NÍVEL: ${jornada.nivel} (${jornada.titulo})
PACIENTE: ${caso.paciente} — ${caso.leito}
SINAIS VITAIS: FC ${caso.vitais.FC}, SpO2 ${caso.vitais.SpO2}%, FR ${caso.vitais.FR}, PA ${caso.vitais.PA}, ${caso.vitais.extra}
SITUAÇÃO: ${caso.situacao}
PERGUNTA: ${caso.pergunta}

PONTOS-CHAVE ESPERADOS (${caso.pontos.length}; mínimo para considerar correta: ${caso.minimo}):
${caso.pontos.map((p, i) => `${i + 1}. ${p.t}`).join("\n")}

RESPOSTA-MODELO DA BANCA:
${caso.gabarito}

RESPOSTA DA FISIOTERAPEUTA:
"""${resposta}"""

Critérios:
- Avalie o raciocínio clínico, não o estilo. Aceite sinônimos e formas equivalentes.
- Condutas corretas e seguras que não estão na lista também contam a favor.
- Qualquer conduta que coloque o paciente em risco é erro grave e torna a resposta "incorreta".
- "correta": cobre pelo menos o mínimo de pontos-chave e não tem erro grave (nota 70–100).
- "parcial": raciocínio no caminho certo mas incompleto (nota 50–69).
- "incorreta": falta o essencial ou há erro grave (nota 0–49).
- Não invente dados que não estão no caso.

Responda SOMENTE com um objeto JSON, sem texto fora dele, neste formato:
{"veredito":"correta|parcial|incorreta","nota":0,"acertos":["ponto que ela acertou, curto"],"faltou":["ponto que faltou, curto"],"erros":["afirmação errada ou perigosa, curta"],"feedback":"2 a 4 frases em segunda pessoa (você), tom de preceptora direta e encorajadora, explicando por que está certo ou o que precisa corrigir e por quê"}`;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: { "content-type": "application/json", "x-api-key": S.cfg.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: S.cfg.model, max_tokens: 1000, messages: [{ role: "user", content: prompt }] })
  });
  if (!res.ok) { let m = ""; try { m = (await res.json()).error.message; } catch (e) {} const err = new Error(m || "HTTP " + res.status); err.status = res.status; throw err; }
  const data = await res.json();
  const text = (data.content || []).map(c => c.text || "").join("");
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  const o = JSON.parse(text.slice(a, b + 1));
  o.veredito = ["correta", "parcial", "incorreta"].includes(o.veredito) ? o.veredito : (o.nota >= 70 ? "correta" : o.nota >= 50 ? "parcial" : "incorreta");
  o.nota = Math.max(0, Math.min(100, Number(o.nota) || 0));
  ["acertos", "faltou", "erros"].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  o.fonte = "ia";
  return o;
}

/* monitor wave */
let raf = 0;
function stopWave() { cancelAnimationFrame(raf); raf = 0; }
function startWave(cv, fc, spo2) {
  const ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const beat = 60 / (fc || 80);
  const ecg = ph => { // ph 0..1
    if (ph < .08) return Math.sin(ph / .08 * Math.PI) * .12;
    if (ph < .14) return 0;
    if (ph < .16) return -.15;
    if (ph < .19) return 1;
    if (ph < .22) return -.3;
    if (ph < .32) return 0;
    if (ph < .46) return Math.sin((ph - .32) / .14 * Math.PI) * .22;
    return 0;
  };
  const pleth = ph => Math.max(0, Math.sin(ph * Math.PI * 1.1)) * (ph < .55 ? 1 : .6) + (ph > .55 && ph < .7 ? .12 : 0);
  let x = 0, last = performance.now(), t = 0, px1 = H * .3, px2 = H * .78;
  ctx.lineWidth = 1.8; ctx.lineJoin = "round";
  const pxPerSec = 70;
  const step = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const dx = dt * pxPerSec;
    ctx.fillStyle = "#050C0D"; ctx.fillRect(x, 0, dx + 10, H);
    t += dt;
    const ph = (t % beat) / beat, ph2 = ((t - .18) % beat + beat) % beat / beat;
    const y1 = H * .32 - ecg(ph) * H * .26;
    const y2 = H * .85 - pleth(ph2) * H * .3;
    ctx.strokeStyle = "#58E08A"; ctx.beginPath(); ctx.moveTo(x, px1); ctx.lineTo(x + dx, y1); ctx.stroke();
    ctx.strokeStyle = "#3CD3F0"; ctx.beginPath(); ctx.moveTo(x, px2); ctx.lineTo(x + dx, y2); ctx.stroke();
    px1 = y1; px2 = y2; x += dx;
    if (x > W) { x = 0; }
    raf = requestAnimationFrame(step);
  };
  ctx.fillStyle = "#050C0D"; ctx.fillRect(0, 0, W, H);
  if (reduce) { for (let i = 0; i < W; i++) { t = i / pxPerSec; const ph = (t % beat) / beat; ctx.fillStyle = "#58E08A"; ctx.fillRect(i, H * .32 - ecg(ph) * H * .26, 1.5, 1.5); } return; }
  raf = requestAnimationFrame(step);
}

function dockCaso(recording) {
  const has = ($("#txt") && $("#txt").value.trim().length > 0);
  if (recording) { setDock(`<button class="btn mic rec" id="mic">${ICON.stop}Parar e revisar</button>`); $("#mic").onclick = stopRec; return; }
  if (!has) { setDock(`<button class="btn mic" id="mic">${ICON.mic}Responder por voz</button>`); $("#mic").onclick = startRec; return; }
  setDock(`<button class="btn ghost" id="mic" aria-label="Continuar falando">${ICON.mic}</button><button class="btn primary" id="enviar">${ICON.send}Enviar resposta</button>`);
  $("#mic").onclick = () => { STT.reset($("#txt").value.trim()); startRec(true); };
  $("#enviar").onclick = enviar;
}
function startRec(keep) {
  if (!STT.ok) { $("#answer").hidden = false; $("#txt").focus(); toast("Use o microfone do teclado para ditar"); return; }
  $("#answer").hidden = false;
  if (!keep) { STT.reset($("#txt").value.trim()); }
  if (navigator.vibrate) navigator.vibrate(30);
  dockCaso(true);
  STT.start((txt, inter, ended) => {
    const ta = $("#txt"); if (!ta) return;
    ta.value = txt; view.resposta = txt;
    $("#interim").textContent = inter ? "… " + inter : "";
    if (ended) dockCaso();
  }, err => {
    dockCaso();
    const msg = err === "not-allowed" || err === "service-not-allowed"
      ? "O navegador bloqueou o microfone. Libere o acesso ao microfone para este site nas configurações do navegador, ou use o microfone do teclado na caixa de resposta."
      : err === "unsupported" ? "Este navegador não transcreve voz. Use o microfone do teclado."
      : "Não consegui ouvir (" + err + "). Tente de novo ou use o microfone do teclado.";
    $("#micnote").textContent = msg;
  });
}
function stopRec() { STT.stop(); setTimeout(() => dockCaso(), 350); }

let evalCtl = null;
async function enviar() {
  STT.stop(); TTS.stop();
  const j = J.find(x => x.id === view.jid), c = j.casos[view.i];
  const resposta = $("#txt").value.trim();
  if (resposta.length < 8) { toast("Responda com um pouco mais de detalhe"); return; }
  view.resposta = resposta; view.tentativas = (view.tentativas || 0) + 1;
  openSheet(`<div class="thinking"><svg class="ecgload" viewBox="0 0 90 30"><path d="M0 15h25l5-10 6 20 6-14 4 4h44" fill="none" stroke="#3CD3F0" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 200;200 0" dur="1.2s" repeatCount="indefinite"/></path></svg><span>${S.cfg.apiKey ? "A preceptora está avaliando sua resposta…" : "Conferindo com o gabarito…"}</span></div>`, false);
  let r;
  if (S.cfg.apiKey) {
    evalCtl = new AbortController();
    try { r = await avaliarIA(c, j, resposta, evalCtl.signal); }
    catch (e) {
      if (e.name === "AbortError") return;
      r = avaliarLocal(c, resposta);
      r.aviso = e.status === 401 ? "Chave da IA inválida. Corrigido pelo gabarito local." : "A IA não respondeu (" + (e.message || "erro") + "). Corrigido pelo gabarito local.";
    }
  } else { await new Promise(res => setTimeout(res, 700)); r = avaliarLocal(c, resposta); }
  mostrarResultado(j, c, r);
}

function mostrarResultado(j, c, r) {
  const ok = r.veredito === "correta", parcial = r.veredito === "parcial";
  const color = ok ? "var(--ok)" : parcial ? "var(--warn)" : "var(--bad)";
  const title = ok ? "Correta" : parcial ? "Quase lá" : "Incorreta";
  let ganho = 0, perdeu = false, novos = [];
  if (!view.revisao) {
    if (ok) {
      combo++;
      let mult = (view.dica ? .7 : 1) * (view.tentativas > 1 ? .75 : 1) * (S.concluidas[j.id] ? .25 : 1);
      const bonus = Math.min(.5, Math.max(0, combo - 1) * .1);
      ganho = Math.round(j.xp * mult * (1 + bonus) + (c.chefe ? 50 : 0));
      S.xp += ganho; S.acertos++; S.comboMax = Math.max(S.comboMax, combo);
      if (view.tentativas === 1 && !view.dica) S.deprimeira++;
      novos = unlock(["primeiro", combo >= 5 && "chamas", S.deprimeira >= 10 && "deprimeira"].filter(Boolean));
    } else {
      combo = 0;
      if (!parcial) { S.hearts[j.id] = heartsOf(j.id) - 1; S.perdeuVida[j.id] = true; perdeu = true; }
    }
    save();
  }
  const R = 30, C = 2 * Math.PI * R, off = C * (1 - r.nota / 100);
  const li = (arr, ic, col) => arr.map(t => `<div class="li">${ic(col)}<span>${esc(t)}</span></div>`).join("");
  const semVidas = heartsOf(j.id) <= 0 && !view.revisao;
  openSheet(`
    <div class="verdict" style="--vc:${color}">
      <div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="${R}" fill="none" stroke="#1F3A3F" stroke-width="7"/><circle cx="36" cy="36" r="${R}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${r.nota}</b></div>
      <div style="display:grid;gap:6px"><h2>${title}</h2>
        ${ganho ? `<span class="xpgain">+${ganho} XP${combo >= 2 ? ` · sequência x${combo}` : ""}</span>` : perdeu ? `<span class="note" style="color:var(--bad)">−1 vida</span>` : view.revisao ? `<span class="note">Modo revisão: sem XP</span>` : `<span class="note">Sem perder vida. Ajuste e tente de novo.</span>`}
      </div>
    </div>
    ${r.aviso ? `<p class="note" style="color:var(--warn)">${esc(r.aviso)}</p>` : ""}
    <p class="feedback">${esc(r.feedback)}</p>
    ${r.acertos.length ? `<div class="list"><span class="label">Você acertou</span>${li(r.acertos, ICON.check, "#58E08A")}</div>` : ""}
    ${r.faltou.length ? `<div class="list"><span class="label">Faltou</span>${li(r.faltou, ICON.minus, "#F4B13D")}</div>` : ""}
    ${r.erros.length ? `<div class="list"><span class="label">Corrija</span>${li(r.erros, ICON.x, "#FF6B6B")}</div>` : ""}
    <div id="gabwrap" ${ok ? "" : "hidden"}><div class="gab"><span class="label">Resposta-modelo</span><p>${esc(c.gabarito)}</p><span class="ref">Base: ${esc(c.ref)}</span></div></div>
    <p class="note">${r.fonte === "ia" ? "Avaliado por IA a partir do gabarito do caso. Em dúvida, confirme no protocolo da sua instituição." : "Correção automática por pontos-chave. Ative a avaliação por IA nas configurações para uma correção mais fina."}</p>
    <div class="actions">
      ${semVidas ? `<button class="btn primary" id="a-over">Ver resultado do plantão</button>`
        : ok ? `<button class="btn primary" id="a-next">${ICON.send}${view.revisao ? "Voltar à jornada" : view.i + 1 >= j.casos.length ? "Concluir jornada" : "Próximo caso"}</button>`
        : `<button class="btn primary" id="a-retry">${ICON.mic}Tentar de novo</button>
           <button class="btn ghost" style="flex:1" id="a-gab">Ver resposta-modelo</button>
           <button class="btn ghost" style="flex:1;display:none" id="a-skip">Seguir para o próximo (sem XP)</button>`}
      <button class="chipbtn" id="a-ouvir" style="justify-self:center">${ICON.speaker}<span>Ouvir feedback</span></button>
    </div>`, true);
  if (navigator.vibrate) navigator.vibrate(ok ? [20, 40, 20] : 120);
  TTS.speak(`${title}. ${r.feedback}`);
  $("#a-ouvir").onclick = () => TTS.speaking ? TTS.stop() : TTS.speak(`${title}. ${r.feedback}`);
  if (ok) { confetti(); novos.forEach((b, k) => setTimeout(() => toast("Conquista: " + b.nome), 900 + k * 1600)); }
  const nx = $("#a-next"); if (nx) nx.onclick = () => { closeSheet(); avancar(j); };
  const rt = $("#a-retry"); if (rt) rt.onclick = () => { closeSheet(); view.resposta = ""; STT.reset(""); renderCaso(); };
  const gb = $("#a-gab"); if (gb) gb.onclick = () => { $("#gabwrap").hidden = false; gb.style.display = "none"; $("#a-skip").style.display = ""; TTS.speak("Resposta-modelo. " + c.gabarito); };
  const sk = $("#a-skip"); if (sk) sk.onclick = () => { closeSheet(); avancar(j, true); };
  const ov = $("#a-over"); if (ov) ov.onclick = () => { closeSheet(); go({ name: "gameover", jid: j.id }); };
}
function avancar(j, semXP) {
  if (view.revisao) { go({ name: "jornada", jid: j.id }); return; }
  S.prog[j.id] = view.i + 1; save();
  if (S.prog[j.id] >= j.casos.length) {
    S.concluidas[j.id] = true;
    const nb = unlock([j.id, !S.perdeuVida[j.id] && "impecavel"].filter(Boolean));
    save(); go({ name: "fim", jid: j.id, novos: nb.map(b => b.id) });
  } else go({ name: "caso", jid: j.id, i: view.i + 1, dica: false, tentativas: 0 });
}
function unlock(ids) { const n = []; ids.forEach(id => { if (!S.badges.includes(id)) { S.badges.push(id); n.push(BADGES.find(b => b.id === id)); } }); save(); return n; }

function renderFim() {
  const j = J.find(x => x.id === view.jid), nb = (view.novos || []).map(id => BADGES.find(b => b.id === id));
  const idx = J.indexOf(j), prox = J[idx + 1];
  app.innerHTML = `<div class="screen"><div class="done-hero">
    <span class="label" style="color:var(--xp)">Plantão encerrado com sucesso</span>
    ${BADGES.find(b => b.id === j.id).svg.replace("<svg", '<svg class="big"')}
    <h1>${j.titulo}: concluída</h1>
    <p class="muted">Você resolveu os ${j.casos.length} casos ${S.perdeuVida[j.id] ? "" : "sem perder nenhuma vida "}e soma ${S.xp.toLocaleString("pt-BR")} XP. Patente atual: <b>${rankOf(S.xp).title}</b>.</p>
  </div>
  ${nb.length ? `<div class="label">Conquistas desbloqueadas</div><div class="badges">${nb.map(b => `<div class="badge">${b.svg}<b>${b.nome}</b></div>`).join("")}</div>` : ""}
  </div>`;
  setDock(prox ? `<button class="btn ghost" id="home" style="flex:0 0 auto">Início</button><button class="btn primary" id="next">${ICON.send}Próximo nível: ${prox.nivel}</button>` : `<button class="btn primary" id="home">Voltar ao início</button>`);
  $("#home").onclick = () => go({ name: "home" });
  const n = $("#next"); if (n) n.onclick = () => go({ name: "jornada", jid: prox.id });
  confetti(true); TTS.speak(`Parabéns! Jornada ${j.titulo} concluída.`);
}
function renderGameOver() {
  const j = J.find(x => x.id === view.jid);
  app.innerHTML = `<div class="screen"><div class="done-hero">
    <span class="label" style="color:var(--bad)">Sem vidas</span>
    ${ICON.heart(false).replace("<svg", '<svg class="big"')}
    <h1>Plantão interrompido</h1>
    <p class="muted">Você chegou ao caso ${(S.prog[j.id] || 0) + 1} de ${j.casos.length}. O XP conquistado continua seu. Revise as respostas-modelo e recomece a jornada com 3 vidas.</p>
  </div></div>`;
  setDock(`<button class="btn ghost" id="home" style="flex:0 0 auto">Início</button><button class="btn primary" id="again">Recomeçar jornada</button>`);
  $("#home").onclick = () => { S.prog[j.id] = 0; S.hearts[j.id] = 3; S.perdeuVida[j.id] = false; save(); go({ name: "home" }); };
  $("#again").onclick = () => { S.prog[j.id] = 0; S.hearts[j.id] = 3; S.perdeuVida[j.id] = false; combo = 0; save(); go({ name: "jornada", jid: j.id }); };
}

/* ---------- sheets, toast, confetti ---------- */
let scrim = null;
function openSheet(html, closable) {
  closeSheet(true);
  scrim = document.createElement("div"); scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  if (closable === "tap") scrim.onclick = e => { if (e.target === scrim) closeSheet(); };
  document.body.appendChild(scrim);
}
function closeSheet(silent) { if (scrim) { scrim.remove(); scrim = null; } if (!silent && evalCtl) { evalCtl.abort(); evalCtl = null; } if (!silent) TTS.stop(); }

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `${BADGE_SVG("#F6C453", "M11 16l3.5 3.5L21 13").replace("<svg", '<svg width="20" height="20"')}<span>${esc(msg)}</span>`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function confetti(big) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"); cv.hidden = false; const ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#58E08A", "#3CD3F0", "#F4CF4A", "#FF7E7E", "#F6C453"];
  const ps = Array.from({ length: big ? 160 : 70 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .55, vx: (Math.random() - .5) * 9, vy: -Math.random() * 13 - 5, s: Math.random() * 6 + 4, r: Math.random() * 6, c: cols[Math.random() * 5 | 0] }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(loop); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}

function askName() {
  openSheet(`<h2>Bem-vinda ao plantão</h2>
    <p class="muted">Você vai receber casos de fisioterapia hospitalar narrados em voz, responder falando e receber correção na hora. Três níveis, cada um com uma jornada e um problema para resolver.</p>
    <div class="field"><label class="label" for="nm">Como quer ser chamada?</label><input id="nm" autocomplete="given-name" placeholder="Seu nome"></div>
    <div class="actions"><button class="btn primary" id="ok">Entrar no plantão</button></div>`, false);
  $("#ok").onclick = () => { S.nome = $("#nm").value.trim().slice(0, 30); save(); closeSheet(); render(); };
}

function openSettings() {
  const voices = TTS.ok ? speechSynthesis.getVoices().filter(v => /^pt/i.test(v.lang)) : [];
  openSheet(`<h2>Configurações</h2>
    <div class="field"><label class="label" for="s-nome">Seu nome</label><input id="s-nome" value="${esc(S.nome)}"></div>
    <div class="field"><label class="label" for="s-key">Chave da API Claude (avaliação por IA)</label>
      <input id="s-key" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(S.cfg.apiKey)}">
      <span class="note">Fica salva só neste aparelho. Sem chave, a correção usa os pontos-chave do gabarito.</span></div>
    <div class="field"><label class="label" for="s-model">Modelo</label>
      <select id="s-model"><option value="claude-sonnet-5-5">Sonnet (mais rigoroso)</option><option value="claude-haiku-5-5">Haiku (mais rápido)</option></select></div>
    <div class="field"><label class="label" for="s-voice">Voz da narração</label>
      <select id="s-voice"><option value="">Automática (português)</option>${voices.map(v => `<option ${v.name === S.cfg.voice ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></div>
    <div class="field"><label class="label" for="s-rate">Velocidade da voz</label>
      <select id="s-rate">${[[.85, "Calma"], [1, "Normal"], [1.15, "Rápida"], [1.3, "Muito rápida"]].map(([v, l]) => `<option value="${v}" ${S.cfg.rate == v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label class="label" for="s-auto">Narrar caso automaticamente</label>
      <select id="s-auto"><option value="1">Sim</option><option value="0" ${S.cfg.autoVoz ? "" : "selected"}>Não</option></select></div>
    <div class="actions">
      <button class="btn primary" id="s-save">Salvar</button>
      <button class="btn ghost" style="flex:1" id="s-test">${ICON.speaker}Testar voz</button>
      <button class="btn ghost" style="flex:1;color:var(--bad)" id="s-reset">Zerar progresso</button>
    </div>`, "tap");
  $("#s-model").value = S.cfg.model;
  $("#s-test").onclick = () => { S.cfg.voice = $("#s-voice").value; S.cfg.rate = +$("#s-rate").value; TTS.speak("Leito 3. Paciente de 64 anos, primeiro dia de pós-operatório."); };
  let armed = false;
  $("#s-reset").onclick = e => {
    if (!armed) { armed = true; e.currentTarget.textContent = "Toque de novo para confirmar"; return; }
    const cfg = S.cfg, nome = S.nome; S = blank(); S.cfg = cfg; S.nome = nome; S._askedName = true; save(); closeSheet(); go({ name: "home" }); toast("Progresso zerado");
  };
  $("#s-save").onclick = () => {
    S.nome = $("#s-nome").value.trim().slice(0, 30);
    S.cfg.apiKey = $("#s-key").value.trim(); S.cfg.model = $("#s-model").value;
    S.cfg.voice = $("#s-voice").value; S.cfg.rate = +$("#s-rate").value; S.cfg.autoVoz = $("#s-auto").value === "1";
    save(); closeSheet(); render(); toast(S.cfg.apiKey ? "Salvo · avaliação por IA ativa" : "Salvo");
  };
}

render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
