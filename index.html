<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Plantão Fisio</title>
<meta name="description" content="Simulador de casos de fisioterapia hospitalar com resposta por voz.">
<meta name="theme-color" content="#060D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plantão Fisio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* UTI à noite: vidro escuro sobre luz de monitor. Números de sinais vitais em fonte de monitor, o resto em sans geométrica. */
:root{
  --bg:#060D10; --bg2:#0B1A1F;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.075); --stroke:rgba(255,255,255,.09); --stroke2:rgba(255,255,255,.16);
  --fg:#EEF6F5; --muted:#93AAA8; --dim:#5F7775;
  --hr:#4BE38A; --spo2:#38D6F5; --fr:#FFD34E; --pa:#FF8282;
  --accent:#38D6F5; --accent2:#6E8BFF; --accent-ink:#031A20; --xp:#FFC857;
  --ok:#4BE38A; --warn:#FFB547; --bad:#FF6B6B;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:22px; --r-sm:14px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15.5px/1.55 var(--body);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 15% 0%,rgba(56,214,245,.16),transparent 70%),
             radial-gradient(50% 35% at 100% 18%,rgba(110,139,255,.14),transparent 70%),
             radial-gradient(70% 40% at 50% 110%,rgba(75,227,138,.08),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:20px;padding-block:12px 150px;flex:1}
.screen>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.screen>*:nth-child(2){animation-delay:.04s}.screen>*:nth-child(3){animation-delay:.08s}.screen>*:nth-child(4){animation-delay:.12s}.screen>*:nth-child(5){animation-delay:.16s}.screen>*:nth-child(6){animation-delay:.2s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}}
.label{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sec h3{font-size:17px}
.sec span{font-size:13px;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px/1 var(--display);color:var(--accent-ink);
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 3px rgba(56,214,245,.18)}
.who small{display:block;font-size:12.5px;color:var(--muted);line-height:1.2}
.who b{display:block;font:800 18px/1.2 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);flex:none;transition:background .2s}
.iconbtn:active{background:var(--glass2)}
.iconbtn svg{width:20px;height:20px}

/* player hero */
.player{position:relative;overflow:hidden;padding:18px;display:grid;gap:16px;
  background:linear-gradient(145deg,rgba(56,214,245,.14),rgba(110,139,255,.08) 55%,rgba(255,255,255,.03));border:1px solid rgba(56,214,245,.22);border-radius:var(--r)}
.player::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(56,214,245,.25),transparent 70%);pointer-events:none}
.player-row{display:flex;align-items:center;gap:16px}
.lvring{position:relative;width:84px;height:84px;flex:none}
.lvring svg{width:84px;height:84px;transform:rotate(-90deg)}
.lvring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.lvring .in b{display:block;font:700 26px/1 var(--num);color:var(--xp)}
.lvring .in span{display:block;font:500 9px/1 var(--mono);letter-spacing:.12em;color:var(--muted);margin-top:2px}
.rank{font:800 23px/1.1 var(--display);letter-spacing:-.02em}
.next{font-size:13px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.22);border:1px solid var(--stroke);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:2px}
.stat b{font:700 24px/1 var(--num);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.25}
.stat .ico{width:16px;height:16px;margin-bottom:4px}

/* level cards */
.levels{display:grid;gap:12px}
.level{position:relative;text-align:left;border-radius:var(--r);padding:16px;display:grid;gap:12px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 13%,transparent),rgba(255,255,255,.03) 60%);border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
  transition:transform .2s ease,border-color .2s}
.level:active{transform:scale(.985)}
.level[data-l="iniciante"]{--c:var(--hr)} .level[data-l="intermediario"]{--c:var(--fr)} .level[data-l="especialista"]{--c:var(--pa)}
.level-head{display:flex;align-items:center;gap:12px}
.lvicon{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.lvicon svg{width:26px;height:26px}
.level-head .t{flex:1;min-width:0;display:grid;gap:5px}
.pips{display:flex;gap:3px;align-items:center} .pips i{width:7px;height:7px;border-radius:50%;background:var(--stroke2)} .pips i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.level h2{font-size:21px}
.level p{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.level-foot{display:flex;align-items:center;gap:12px}
.prog{flex:1;display:grid;gap:6px}
.prog .bar{height:6px}
.prog small{font-size:12px;color:var(--muted)}
.go{font:700 13.5px/1 var(--body);color:#04140C;background:var(--c);border-radius:99px;padding:10px 14px;display:flex;align-items:center;gap:6px;flex:none}
.go svg{width:15px;height:15px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,linear-gradient(90deg,#FF9F43,var(--xp)));transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* badges */
.badges{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:0 0 96px;scroll-snap-align:start;text-align:center;display:grid;gap:8px;justify-items:center;padding:14px 8px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke)}
.badge svg{width:38px;height:38px}
.badge b{font:600 11.5px/1.25 var(--body)}
.badge.off{opacity:.38;filter:grayscale(1)}
.install{display:flex;gap:12px;align-items:center;padding:14px 16px;font-size:13.5px;color:var(--muted)}
.install svg{width:22px;height:22px;flex:none;color:var(--accent)}

/* journey */
.backrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}
.backrow .mid{flex:1;text-align:center}
.hearts{display:flex;gap:3px;padding:7px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke)}
.hearts svg{width:19px;height:19px}
.combo{font:700 14px/1 var(--num);color:#2A1700;background:var(--xp);padding:6px 9px;border-radius:99px;letter-spacing:.04em}
.jhero{position:relative;overflow:hidden;border-radius:var(--r);padding:20px 18px;display:grid;gap:12px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.03) 70%);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.jhero .wavebg{position:absolute;right:-6px;bottom:18px;width:170px;opacity:.22;pointer-events:none}
.jhero p{color:#D7E6E3;font-size:15px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);font-size:14px;font-weight:600;justify-self:start;transition:background .2s,border-color .2s}
.chipbtn svg{width:18px;height:18px}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(56,214,245,.12)}
.path{display:grid;gap:10px}
.node{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);position:relative}
.node .dot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);font:700 20px/1 var(--num)}
.node.done .dot{background:var(--c);color:#06201A}
.node.cur{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 10%,transparent)}
.node.cur .dot{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.node.lock{opacity:.42}
.node b{display:block;font:700 14.5px/1.3 var(--body)}
.node span span{font-size:13px;color:var(--muted)}
.node .boss{font:500 9.5px/1 var(--mono);letter-spacing:.1em;color:var(--pa);background:rgba(255,130,130,.12);border-radius:99px;padding:6px 8px}
.node .play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#06201A}
.node .play svg{width:14px;height:14px}

/* monitor */
.monitor{border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,#071214,#030809);border:1px solid rgba(56,214,245,.18);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 20px 40px -20px rgba(56,214,245,.25),inset 0 1px 0 rgba(255,255,255,.04)}
.mon-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.05)}
.mon-head .live{display:flex;align-items:center;gap:6px;color:var(--hr)}
.mon-head .live i{width:7px;height:7px;border-radius:50%;background:var(--hr);box-shadow:0 0 8px var(--hr);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.waves{position:relative}
.wave{display:block;width:100%;height:132px}
.wlabels{position:absolute;right:10px;top:0;bottom:0;text-align:right;display:grid;grid-template-rows:repeat(3,1fr);pointer-events:none}
.wlabels span{font:500 9.5px/1 var(--mono);letter-spacing:.08em;padding-top:8px}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.vital{padding:9px 10px 10px;border-radius:12px;background:rgba(255,255,255,.035);min-width:0;position:relative;transition:background .3s}
.vital .label{font-size:9.5px;color:var(--vc);opacity:.9;letter-spacing:.1em}
.vital b{display:block;font:600 34px/1 var(--num);color:var(--vc);font-variant-numeric:tabular-nums;margin-top:6px;white-space:nowrap;text-shadow:0 0 18px color-mix(in srgb,var(--vc) 45%,transparent)}
.vital.pa b{font-size:25px;margin-top:9px}
.vital.pa b small{font-size:15px;opacity:.75;margin-left:1px}
.vital.alarm{background:color-mix(in srgb,var(--bad) 16%,transparent);animation:alarm 1.6s infinite}
.vital.alarm::after{content:"";position:absolute;right:8px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
@keyframes alarm{50%{background:color-mix(in srgb,var(--bad) 6%,transparent)}}
.extra{padding:10px 14px;border-top:1px solid rgba(255,255,255,.05);font:500 11.5px/1.3 var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:10px}

/* case body */
.casecard{padding:18px;display:grid;gap:12px}
.casehead{display:grid;gap:8px}
.tagline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--muted)}
.tag.boss{color:var(--pa);background:rgba(255,130,130,.13)}
.situ{color:#D9E8E5;font-size:15.5px;line-height:1.6}
.ask{position:relative;border-radius:18px;padding:16px 16px 16px 50px;font:700 16.5px/1.45 var(--body);
  background:linear-gradient(135deg,rgba(56,214,245,.16),rgba(110,139,255,.10));border:1px solid rgba(56,214,245,.3)}
.ask svg{position:absolute;left:16px;top:17px;width:22px;height:22px;color:var(--accent)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke);font-size:12.5px;font-weight:600;color:#D7E6E3;transition:background .2s,border-color .2s}
.tool svg{width:21px;height:21px}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(56,214,245,.1)}
.tool:disabled{opacity:.4}
.hint{display:flex;gap:12px;border-radius:18px;padding:14px 16px;font-size:14.5px;background:rgba(255,200,87,.09);border:1px solid rgba(255,200,87,.3)}
.hint svg{width:20px;height:20px;flex:none;color:var(--xp);margin-top:1px}
.answer{display:grid;gap:8px}
.answer textarea{width:100%;min-height:130px;resize:vertical;background:var(--glass);color:var(--fg);border:1px solid var(--stroke);border-radius:18px;padding:14px;font:15.5px/1.55 var(--body)}
.answer textarea:focus{border-color:rgba(56,214,245,.5)}
.answer .interim{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,transparent,rgba(6,13,16,.92) 40%)}
.dock-in{max-width:524px;margin:0 auto;display:flex;gap:10px;align-items:center;pointer-events:auto;padding:8px;border-radius:26px;
  background:rgba(14,28,33,.72);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.btn{flex:1;min-height:54px;border-radius:19px;font:700 16px/1 var(--body);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:21px;height:21px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 8px 24px -8px rgba(56,214,245,.6)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--stroke);flex:0 0 auto}
.btn:disabled{opacity:.5}
.mic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 8px 24px -8px rgba(56,214,245,.6)}
.mic.rec{background:linear-gradient(135deg,#FF7A7A,#FF4D6D);color:#fff;box-shadow:0 0 0 0 rgba(255,90,110,.6);animation:pulse 1.4s infinite}
.bars{display:flex;gap:3px;align-items:center;height:20px}
.bars i{width:3px;border-radius:2px;background:currentColor;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,110,.55)}70%{box-shadow:0 0 0 14px rgba(255,90,110,0)}100%{box-shadow:0 0 0 0 rgba(255,90,110,0)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,6,8,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:linear-gradient(180deg,#10232A,#0A171B);border:1px solid var(--stroke);border-bottom:0;border-radius:28px 28px 0 0;
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";width:40px;height:5px;border-radius:99px;background:var(--stroke2);justify-self:center;margin-bottom:4px}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.verdict{display:flex;align-items:center;gap:16px}
.ring{width:78px;height:78px;flex:none;position:relative}
.ring svg{width:78px;height:78px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 28px/1 var(--num)}
.verdict h2{color:var(--vc);font-size:26px}
.xpgain{display:inline-block;font:700 18px/1 var(--num);color:#2A1700;background:var(--xp);padding:6px 10px;border-radius:99px;justify-self:start}
.feedback{font-size:15.5px;color:#DCEAE7;line-height:1.6}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:14px;align-items:start}
.li svg{width:18px;height:18px;margin-top:2px}
.gab{background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:18px;padding:14px 16px;display:grid;gap:8px;font-size:14.5px}
.gab .ref{font-size:12px;color:var(--muted)}
.sheet .actions{display:grid;gap:10px}
.field{display:grid;gap:7px}
.field input,.field select{background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--fg);border-radius:14px;padding:13px 14px;font:16px var(--body);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.thinking{display:flex;align-items:center;gap:14px;color:var(--muted);padding:12px 0 6px}
.ecgload{width:90px;height:30px}
.done-hero{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:28px}
.done-hero svg.big{width:110px;height:110px;filter:drop-shadow(0 0 24px rgba(255,200,87,.35))}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:rgba(16,35,42,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,200,87,.5);color:var(--fg);padding:11px 16px;border-radius:16px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;max-width:90%;box-shadow:var(--shadow);animation:drop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);

const BADGE_SVG = (color, path) => `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l11 4.5v8.8c0 7-4.7 12.4-11 14.7C9.7 27.7 5 22.3 5 15.3V6.5z" fill="${color}22" stroke="${color}" stroke-width="1.6"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const BADGES = [
  { id: "primeiro", nome: "Primeiro atendimento", desc: "Acerte o primeiro caso", svg: BADGE_SVG("#3CD3F0", "M11 16l3.5 3.5L21 13") },

  { id: "especialista", nome: "Guardiã do pulmão", desc: "Conclua a jornada Especialista", svg: BADGE_SVG("#FF7E7E", "M16 10v11M16 13c-2-2-5-1-5 3s1 4 5 4M16 13c2-2 5-1 5 3s-1 4-5 4") },
  { id: "impecavel", nome: "Plantão impecável", desc: "Conclua uma jornada sem perder vida", svg: BADGE_SVG("#F6C453", "M16 9l2 4.3 4.6.5-3.4 3.1 1 4.6-4.2-2.4-4.2 2.4 1-4.6-3.4-3.1 4.6-.5z") },
  { id: "chamas", nome: "Em chamas", desc: "5 acertos seguidos", svg: BADGE_SVG("#F4B13D", "M16 22c-3 0-5-2-5-4.5 0-3 3-4 3-7 2 1 3 3 3 4 1-1 1-2 1-3 2 1.5 3 3.5 3 5.5 0 3-2 5-5 5z") },
  { id: "ferro", nome: "Plantonista de ferro", desc: "Faça 24 pontos no Plantão de 12h", svg: BADGE_SVG("#6E8BFF", "M11 13h9v3a4.5 4.5 0 0 1-9 0zM20 14h1.2a1.6 1.6 0 0 1 0 3.2H20M13.5 10.5c0-1 1-1.2 1-2.2M17 10.5c0-1 1-1.2 1-2.2") },
  { id: "deprimeira", nome: "De primeira", desc: "10 acertos de primeira, sem dica", svg: BADGE_SVG("#B79CFF", "M16 9v14M12 13l4-4 4 4") }
];
const RANKS = [
  [0, "Estagiária"], [300, "Residente R1"], [800, "Residente R2"],
  [1500, "Plantonista"], [2500, "Intensivista"], [3600, "Preceptora"]
];

/* ---------- estado ---------- */
const KEY = "plantao-fisio-v1";
const blank = () => ({ stars: {}, raiox: {}, rec12: 0, nome: "", xp: 0, acertos: 0, deprimeira: 0, comboMax: 0, badges: [], prog: {}, hearts: {}, concluidas: {}, perdeuVida: {},
  cfg: { apiKey: "", model: "claude-sonnet-5-5", rate: 1, voice: "", autoVoz: true, vozGravada: true, livre: false, bipe: false } });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); S.cfg = Object.assign(blank().cfg, S.cfg || {}); } catch (e) { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// link de configuração: ...#k=sk-ant-...  (salva a chave neste aparelho e limpa o endereço)
(function () {
  const m = location.hash.match(/k=([A-Za-z0-9_\-]+)/);
  if (m) { S.cfg.apiKey = m[1]; save(); history.replaceState(null, "", location.pathname); setTimeout(() => toast("Avaliação por IA ativada neste aparelho"), 400); }
})();

let combo = 0;
let view = { name: "home" };

const rankOf = xp => { let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (xp >= RANKS[i][0]) { r = RANKS[i]; next = RANKS[i + 1] || null; } } return { title: r[1], base: r[0], next }; };
const heartsOf = id => S.hearts[id] ?? 3;

/* ---------- voz: narração ---------- */
// Áudios gravados com voz neural (pasta audio/, gerados pelo GitHub Actions).
// Quando não houver gravação, usa a melhor voz em português do aparelho.
let AUDIOS = {}, AUDIOS_OK = false;
const audiosProntos = fetch("audio/index.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null)
  .then(d => { if (d && d.arquivos) AUDIOS = d.arquivos; }).catch(() => {}).finally(() => { AUDIOS_OK = true; });
const ROT = window.ROTEIRO();
const TTS = {
  ok: "speechSynthesis" in window,
  speaking: false, queue: [], onEnd: null, audio: null,
  voices() { return this.ok ? speechSynthesis.getVoices().filter(v => /^pt(-|_)?BR/i.test(v.lang) || /portugu[eê]s.*brasil/i.test(v.name)) : []; },
  voice() {
    if (S.cfg.voice) { const v = speechSynthesis.getVoices().find(v => v.name === S.cfg.voice); if (v) return v; }
    const vs = this.voices();
    const score = v => (/natural|neural|online/i.test(v.name) ? 40 : 0) + (/premium|aprimorad|enhanced/i.test(v.name) ? 30 : 0) +
      (/google/i.test(v.name) ? 20 : 0) + (/francisca|thalita|luciana/i.test(v.name) ? 10 : 0) + (v.localService ? 0 : 5);
    return vs.sort((a, b) => score(b) - score(a))[0] || null;
  },
  // id: chave do roteiro gravado; text: texto livre (feedback da IA)
  say(id, text, onEnd) {
    this.stop();
    // espera o índice de áudios gravados para não cair na voz do aparelho sem necessidade
    if (!AUDIOS_OK && id) { const tok = this.tok; Promise.race([audiosProntos, new Promise(r => setTimeout(r, 2500))]).then(() => { AUDIOS_OK = true; if (tok === this.tok) this.say(id, text, onEnd); }); return; }
    const file = id && AUDIOS[id];
    if (file && S.cfg.vozGravada !== false) {
      const a = new Audio("audio/" + file);
      a.playbackRate = S.cfg.rate || 1;
      a.onended = () => { if (this.audio === a) { this.audio = null; this.speaking = false; onEnd && onEnd(); } };
      a.onerror = () => { if (this.audio === a) { this.audio = null; this._tts(text || ROT[id], onEnd); } };
      this.audio = a; this.speaking = true;
      a.play().catch(() => { if (this.audio === a) { this.audio = null; this._tts(text || ROT[id], onEnd); } });
      return;
    }
    this._tts(text || ROT[id] || "", onEnd);
  },
  speak(text, onEnd) { this.say(null, text, onEnd); },
  _tts(text, onEnd) {
    if (!this.ok || !text) { onEnd && onEnd(); return; }
    const parts = window.FALAR(text).match(/[^.!?;:]+[.!?;:]?/g) || [text];
    this.queue = parts.map(p => p.trim()).filter(Boolean);
    this.onEnd = onEnd || null; this.speaking = true; this._next();
  },
  _next() {
    if (!this.queue.length) { this.speaking = false; const f = this.onEnd; this.onEnd = null; f && f(); return; }
    const u = new SpeechSynthesisUtterance(this.queue.shift());
    u.lang = "pt-BR"; u.rate = S.cfg.rate || 1; const v = this.voice(); if (v) u.voice = v;
    u.onend = () => { if (this.speaking) this._next(); };
    u.onerror = () => { if (this.speaking) this._next(); };
    speechSynthesis.speak(u);
  },
  tok: 0,
  stop() {
    this.tok++; this.speaking = false; this.queue = []; this.onEnd = null;
    if (this.audio) { const a = this.audio; this.audio = null; try { a.pause(); } catch (e) {} }
    try { this.ok && speechSynthesis.cancel(); } catch (e) {}
  }
};
if (TTS.ok) speechSynthesis.onvoiceschanged = () => {};

/* ---------- voz: reconhecimento ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STT = {
  ok: !!SR, rec: null, on: false, base: "", sess: "", onUpdate: null, onError: null,
  start(onUpdate, onError) {
    if (!SR) { onError && onError("unsupported"); return; }
    TTS.stop();
    this.onUpdate = onUpdate; this.onError = onError; this.on = true; this.sess = "";
    this._spawn();
  },
  _spawn() {
    const r = new SR();
    r.lang = "pt-BR"; r.interimResults = true; r.continuous = !isAndroid; r.maxAlternatives = 1;
    r.onresult = e => {
      let fin = "", inter = "";
      for (let i = 0; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t + " "; else inter += t; }
      this.sess = fin;
      this.onUpdate && this.onUpdate((this.base + " " + fin).trim(), inter);
    };
    r.onerror = e => { if (e.error === "no-speech" || e.error === "aborted") return; this.on = false; this.onError && this.onError(e.error); };
    r.onend = () => {
      this.base = (this.base + " " + this.sess).trim(); this.sess = "";
      if (this.on) { try { this._spawn(); } catch (e) { this.on = false; } }
      else this.onUpdate && this.onUpdate(this.base, "", true);
    };
    this.rec = r;
    try { r.start(); } catch (e) {}
  },
  stop() { this.on = false; try { this.rec && this.rec.stop(); } catch (e) {} },
  reset(t = "") { this.base = t; this.sess = ""; }
};

/* ---------- avaliação ---------- */
// Correção local (sem IA): procura cada ponto-chave pelo sentido aproximado,
// aceitando variações de palavra, ordem diferente e erros de transcrição de voz.
const STOP = new Set("de da do das dos a o e em no na nos nas um uma para por com que se ao aos as os eu ele ela".split(" "));
const toks = s => norm(s).replace(/(\d)[,.](\d)/g, "$1§$2").replace(/[^a-z0-9§]+/g, " ").replace(/§/g, ",").trim().split(" ").filter(Boolean);
function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function wordHit(w, t) {
  if (w === t) return true;
  if (/^\d/.test(t)) return w.replace(/,/g, ".") === t.replace(/,/g, ".");
  if (t.length <= 3) return false;
  if (w.startsWith(t)) return true;                                   // radical: "atelect" → "atelectasia"
  const raiz = t.slice(0, Math.max(4, t.length - 2));
  if (t.length >= 5 && w.startsWith(raiz)) return true;               // flexão: "reduzir" → "reduzindo"
  if (t.length >= 6 && lev(w.slice(0, t.length), t) <= 1) return true; // erro de transcrição
  return false;
}
function termHit(ws, txt, term) {
  const t = norm(term);
  if (t.length > 4 && txt.includes(t)) return true;
  const alvo = toks(t).filter(x => !STOP.has(x));
  if (!alvo.length) return false;
  return alvo.every(a => ws.some(w => wordHit(w, a)));                // todas as palavras, em qualquer ordem
}
function avaliarLocal(caso, resposta) {
  const txt = norm(resposta), ws = toks(resposta);
  const acertos = [], faltou = [];
  caso.pontos.forEach(p => (p.k.some(k => termHit(ws, txt, k)) ? acertos : faltou).push(p.t));
  const n = acertos.length, min = caso.minimo, tot = caso.pontos.length;
  const alvoOk = Math.max(2, min - 1);                                 // tolerância: um ponto a menos que o mínimo
  const nota = Math.min(100, Math.round(n / Math.max(alvoOk, 1) * 70 + (n > alvoOk ? (n - alvoOk) / Math.max(1, tot - alvoOk) * 30 : 0)));
  const veredito = n >= alvoOk ? "correta" : n >= 1 ? "parcial" : "incorreta";
  const fb = veredito === "correta"
    ? `Correta. O essencial do raciocínio está na sua resposta.` + (faltou.length ? " Abaixo, o que deixaria a resposta ainda mais completa." : "")
    : veredito === "parcial"
      ? `Você está no caminho certo, mas faltou parte do raciocínio central. Veja o que faltou e tente de novo. Se você falou isso com outras palavras, toque em "Acho que acertei".`
      : `Não encontrei os pontos principais na sua resposta. Confira a resposta-modelo. Se você explicou de outro jeito, toque em "Acho que acertei".`;
  return { veredito, nota, sintese: "", acertos, faltou, erros: [], feedback: fb, fonte: "gabarito" };
}

async function avaliarIA(caso, jornada, resposta, signal) {
  const prompt = `Você é uma preceptora experiente de fisioterapia hospitalar e intensiva. Uma fisioterapeuta respondeu EM VOZ ALTA a um caso clínico de simulado, e a fala foi transcrita automaticamente.

Como ler a resposta:
- É fala espontânea: tem hesitação, repetição, ordem livre, frases soltas, raciocínio em voz alta e erros de transcrição (palavras trocadas por outras parecidas, números por extenso, siglas grafadas errado). Reconstrua o que ela QUIS dizer antes de avaliar.
- Primeiro sintetize, com suas palavras, o raciocínio clínico dela em 1 ou 2 frases.
- Dê crédito a um ponto quando a ideia aparecer em QUALQUER parte da fala, inclusive no meio de uma explicação, de forma implícita, com outros termos ou como justificativa de outra conduta. Exemplo: se ela diz "vou deixar a saturação entre 88 e 92 porque ele retém CO2", ela acertou o alvo de saturação E o risco de hipercapnia.
- Não exija terminologia exata, a mesma ordem, nem todos os pontos da lista. A lista é um guia da banca, não um checklist literal.
- Condutas corretas e seguras que não estão na lista contam a favor.

NÍVEL: ${jornada.nivel} (${jornada.titulo})
PACIENTE: ${caso.paciente} — ${caso.leito}
SINAIS VITAIS: FC ${caso.vitais.FC}, SpO2 ${caso.vitais.SpO2}%, FR ${caso.vitais.FR}, PA ${caso.vitais.PA}, ${caso.vitais.extra}
SITUAÇÃO: ${caso.situacao}
PERGUNTA: ${caso.pergunta}

PONTOS-CHAVE QUE A BANCA ESPERA (${caso.pontos.length}; referência de mínimo: ${caso.minimo}):
${caso.pontos.map((p, i) => `${i + 1}. ${p.t}`).join("\n")}

RESPOSTA-MODELO DA BANCA:
${caso.gabarito}

FALA TRANSCRITA DA FISIOTERAPEUTA:
"""${resposta}"""

Como decidir:
- "correta" (nota 70–100): o raciocínio central e a conduta principal estão certos e seguros, mesmo que incompletos ou mal formulados. Na dúvida entre correta e parcial, e sem erro de segurança, escolha correta.
- "parcial" (nota 45–69): está no caminho, mas falta o núcleo do raciocínio ou a conduta principal.
- "incorreta" (nota 0–44): o essencial não aparece, ou há conduta que coloca o paciente em risco.
- Não invente dados que não estão no caso e não atribua a ela algo que ela não disse.

Responda SOMENTE com um objeto JSON:
{"sintese":"o que você entendeu da resposta dela, 1-2 frases","veredito":"correta|parcial|incorreta","nota":0,"acertos":["ponto que ela acertou, curto"],"faltou":["só o que realmente faltou, curto"],"erros":["só afirmação errada ou perigosa"],"feedback":"2 a 4 frases em segunda pessoa (você), tom de preceptora direta e encorajadora: comece pelo que ela acertou e depois diga o que ajustar e por quê"}`;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: { "content-type": "application/json", "x-api-key": S.cfg.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: S.cfg.model, max_tokens: 1200, messages: [{ role: "user", content: prompt }] })
  });
  if (!res.ok) { let m = ""; try { m = (await res.json()).error.message; } catch (e) {} const err = new Error(m || "HTTP " + res.status); err.status = res.status; throw err; }
  const data = await res.json();
  const text = (data.content || []).map(c => c.text || "").join("");
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  const o = JSON.parse(text.slice(a, b + 1));
  o.nota = Math.max(0, Math.min(100, Number(o.nota) || 0));
  o.veredito = ["correta", "parcial", "incorreta"].includes(o.veredito) ? o.veredito : (o.nota >= 70 ? "correta" : o.nota >= 45 ? "parcial" : "incorreta");
  ["acertos", "faltou", "erros"].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  o.sintese = typeof o.sintese === "string" ? o.sintese : "";
  o.fonte = "ia";
  return o;
}

/* ---------- monitor: ondas simuladas no ritmo dos sinais vitais do caso ---------- */
// Sempre animado (é o coração da experiência), mesmo com "reduzir movimento" ligado no aparelho.
const LOOPS = []; let vitTimer = 0;
function stopWave() { LOOPS.splice(0).forEach(L => { L.alive = false; cancelAnimationFrame(L.raf); }); clearInterval(vitTimer); vitTimer = 0; }
function startWave(cv, fc, fr, opt = {}) {
  if (!cv) return;
  const L = { alive: true, raf: 0 }; LOOPS.push(L);
  const ch = opt.ch || 3, transp = opt.bg === "transparent", BG = transp ? null : (opt.bg || "#030809");
  const ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 320, H = cv.clientHeight || 120;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const beat = 60 / (fc || 80), breath = 60 / (fr || 16);
  const ecg = ph => {
    if (ph < .08) return Math.sin(ph / .08 * Math.PI) * .12;
    if (ph < .14) return 0;
    if (ph < .16) return -.15;
    if (ph < .19) return 1;
    if (ph < .22) return -.3;
    if (ph < .32) return 0;
    if (ph < .46) return Math.sin((ph - .32) / .14 * Math.PI) * .22;
    return 0;
  };
  const pleth = ph => Math.max(0, Math.sin(ph * Math.PI * 1.1)) * (ph < .55 ? 1 : .6) + (ph > .55 && ph < .7 ? .12 : 0);
  const capno = ph => ph < .08 ? ph / .08 : ph < .4 ? 1 + (ph - .08) * .15 : ph < .48 ? 1.05 * (1 - (ph - .4) / .08) : 0;
  const cols = ch === 1 ? [opt.color || "#4BE38A"] : ["#4BE38A", "#38D6F5", "#FFD34E"];
  const fns = [t => ecg((t % beat) / beat), t => pleth((((t - .18) % beat) + beat) % beat / beat), t => capno((t % breath) / breath)];
  const base = r => ch === 1 ? H * .7 : (H * (r + 1) / 3) - H * .06;
  const amp = r => ch === 1 ? H * .55 : r === 0 ? H * .24 : H * .1;
  const pxPerSec = opt.speed || 70;
  const erase = (x0, w) => { if (transp) ctx.clearRect(x0, 0, w, H); else { ctx.fillStyle = BG; ctx.fillRect(x0, 0, w, H); } };
  const gridCol = (x0, x1) => {
    if (transp) return;
    ctx.strokeStyle = "rgba(56,214,245,.06)"; ctx.lineWidth = 1;
    for (let gx = Math.ceil(x0 / 16) * 16; gx < x1; gx += 16) { ctx.beginPath(); ctx.moveTo(gx + .5, 0); ctx.lineTo(gx + .5, H); ctx.stroke(); }
    for (let gy = 0; gy < H; gy += 16) { ctx.beginPath(); ctx.moveTo(x0, gy + .5); ctx.lineTo(x1, gy + .5); ctx.stroke(); }
  };
  erase(0, W); gridCol(0, W);
  let x = 0, last = performance.now(), t = 0, prev = cols.map((_, r) => base(r)), lastPh = 0;
  const step = now => {
    if (!L.alive) return;
    const dt = Math.min(.06, (now - last) / 1000); last = now; t += dt;
    const dx = dt * pxPerSec;
    erase(x + 1, 18); gridCol(x + 1, x + 19);
    for (let r = 0; r < cols.length; r++) {
      const y = base(r) - fns[r](t) * amp(r);
      ctx.lineCap = "round";
      ctx.strokeStyle = cols[r];
      ctx.globalAlpha = .22; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, prev[r]); ctx.lineTo(x + dx, y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, prev[r]); ctx.lineTo(x + dx, y); ctx.stroke();
      prev[r] = y;
    }
    const ph = (t % beat) / beat;
    if (opt.bipe && S.cfg.bipe && lastPh < .17 && ph >= .17) beep(1046, .05, .045);
    lastPh = ph;
    x += dx; if (x > W) x = 0;
    L.raf = requestAnimationFrame(step);
  };
  L.raf = requestAnimationFrame(step);
}

let AC = null;

function beep(f = 880, d = .08, v = .08, t0 = 0, type = "sine") {

  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
const somAlarme = () => [0, .2, .4, 1, 1.2, 1.4].forEach(t => beep(988, .15, .09, t, "square"));

/* ---------- estrelas, relógio e utilidades de jogo ---------- */
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="${on ? "#FFC857" : "rgba(255,255,255,.12)"}"/></svg>`;
const starsHTML = (n, max = 3) => `<span class="stars" aria-label="${n} de ${max} estrelas">${Array.from({ length: max }, (_, k) => STAR(k < n)).join("")}</span>`;
const estrelasDe = jid => (S.stars[jid] || []).reduce((a, b) => a + (b || 0), 0);
const hora = i => String((19 + i * 2) % 24).padStart(2, "0") + ":00";
const aberto = i => S.cfg.livre || i === 0 || !!S.concluidas[J[i - 1].id];
const dozeAberto = () => S.cfg.livre || J.every(j => S.concluidas[j.id]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const k = Math.random() * (i + 1) | 0; [a[i], a[k]] = [a[k], a[i]]; } return a; };

/* ---------- pergunta rápida com cronômetro ---------- */
function perguntaRapida({ nivel, idx, tempo = 20, titulo = "", alarme = false, contador = "" }) {
  return new Promise(res => {
    const q = window.RAPIDAS[nivel][idx];
    const ordem = shuffle(q.o.map((_, k) => k));
    const d = document.createElement("div");
    d.className = "qz" + (alarme ? " alarme" : "");
    d.innerHTML = `<div class="qz-in" role="dialog" aria-modal="true">
      <div class="qz-head"><span class="qz-tag">${alarme ? `<i class="siren"></i>` : ""}${esc(titulo)}</span><span class="qz-count">${contador}</span></div>
      <div class="qz-timer"><i></i><span id="qz-s">${tempo}s</span></div>
      <h2>${esc(q.q)}</h2>
      <div class="qz-opts">${ordem.map((k, n) => `<button data-k="${k}"><b>${"ABCD"[n]}</b><span>${esc(q.o[k])}</span></button>`).join("")}</div>
      <div class="qz-exp" hidden></div>
      <button class="btn primary qz-go" hidden>${ICON.send}Continuar</button>
    </div>`;
    document.body.appendChild(d);
    if (alarme) { somAlarme(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
    setTimeout(() => TTS.say(`q-${nivel}-${idx}`), alarme ? 1500 : 150);
    const bar = d.querySelector(".qz-timer i"), seg = d.querySelector("#qz-s");
    bar.style.transition = `width ${tempo}s linear`;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = "0%"; }));
    let left = tempo, done = false;
    const tick = setInterval(() => { left--; seg.textContent = Math.max(0, left) + "s"; if (left <= 5) { d.classList.add("urgente"); beep(1200, .04, .04); } }, 1000);
    const fim = k => {
      if (done) return; done = true; clearInterval(tick); clearTimeout(to); TTS.stop();
      const ok = k === q.c;
      const w = getComputedStyle(bar).width; bar.style.transition = "none"; bar.style.width = w;
      d.querySelectorAll(".qz-opts button").forEach(b => { b.disabled = true; const kk = +b.dataset.k; if (kk === q.c) b.classList.add("ok"); else if (kk === k) b.classList.add("bad"); });
      const ex = d.querySelector(".qz-exp"); ex.hidden = false;
      ex.innerHTML = `<b style="color:${ok ? "var(--ok)" : "var(--bad)"}">${k === null ? "Tempo esgotado." : ok ? "Isso!" : "Não foi dessa vez."}</b> ${esc(q.e)}`;
      ok ? somAcerto() : somErro();
      if (navigator.vibrate) navigator.vibrate(ok ? 30 : 140);
      const go = d.querySelector(".qz-go"); go.hidden = false; go.focus();
      go.onclick = () => { d.classList.add("out"); setTimeout(() => d.remove(), 220); res(ok); };
    };
    const to = setTimeout(() => fim(null), tempo * 1000);
    d.querySelectorAll(".qz-opts button").forEach(b => b.onclick = () => fim(+b.dataset.k));
  });
}

/* intercorrência entre um caso e outro */
async function intercorrencia(j, i) {
  const ok = await perguntaRapida({ nivel: j.id, idx: i, tempo: 20, titulo: `Intercorrência · ${hora(i + 1).replace(":00", "h")}`, alarme: true });
  if (ok) { combo++; const g = 40 + Math.min(20, combo * 4); S.xp += g; S.comboMax = Math.max(S.comboMax, combo); toast(`+${g} XP · intercorrência resolvida`); }
  else combo = 0;
  save();
}

/* rodada Raio-X no fim de cada jornada */
function rodadaRaioX(j) {
  return new Promise(res => {
    openSheet(`<span class="label" style="color:var(--xp)">Rodada final</span>
      <h2>Raio-X do plantão</h2>
      <p class="muted">Seis perguntas rápidas de ${esc(j.titulo)}, 15 segundos cada. Cada acerto vale 30 XP, e acertar todas dá bônus de 100 XP.</p>
      <div class="actions"><button class="btn primary" id="rx-go">${ICON.send}Valendo!</button></div>`, false);
    TTS.say("fx-raiox");
    $("#rx-go").onclick = async () => {
      closeSheet();
      let n = 0;
      for (let k = 0; k < 6; k++) {
        const ok = await perguntaRapida({ nivel: j.id, idx: 5 + k, tempo: 15, titulo: "Raio-X do plantão", contador: `${k + 1}/6` });
        if (ok) { n++; S.xp += 30; }
      }
      if (n === 6) S.xp += 100;
      S.raiox[j.id] = Math.max(S.raiox[j.id] || 0, n);
      save(); res(n);
    };
  });
}

/* ---------- modo Plantão de 12h (sobrevivência) ---------- */

  app.innerHTML = `<div class="screen" style="--c:var(--accent2)">
    <div class="backrow"><button class="iconbtn" id="back" aria-label="Voltar">${ICON.back}</button><span class="mid label">Modo sobrevivência</span><span style="width:44px"></span></div>
    <div class="jhero">
      <span class="label" style="color:var(--accent2)">Desafio final</span>
      <h1>Plantão de 12 horas</h1>
      <p>Todas as perguntas rápidas dos três setores, embaralhadas. Você tem 3 vidas e o tempo de resposta diminui a cada 4 acertos. Até onde você aguenta?</p>
      <canvas class="strip" id="strip"></canvas>
    </div>
    <div class="stats">
      <div class="stat">${SMALL.trophy}<b>${S.rec12 || 0}</b><span>seu recorde</span></div>
      <div class="stat">${SMALL.case}<b>36</b><span>perguntas no total</span></div>
      <div class="stat">${SMALL.flame}<b>20s</b><span>tempo inicial</span></div>
    </div>
  </div>`;
  startWave($("#strip"), 96, 18, { ch: 1, bg: "transparent", color: "#6E8BFF" });
  setDock(`<button class="btn primary" id="go12">${ICON.send}Começar plantão</button>`);
  $("#back").onclick = () => go({ name: "home" });
  $("#go12").onclick = async () => {
    setDock(""); TTS.say("fx-12h");
    await new Promise(r => setTimeout(r, 2600));
    const pool = shuffle(Object.keys(window.RAPIDAS).flatMap(n => window.RAPIDAS[n].map((_, k) => [n, k])));
    let vidas = 3, pts = 0;
    for (const [n, k] of pool) {
      const tempo = Math.max(8, 20 - Math.floor(pts / 4) * 2);
      const relog = String((19 + Math.floor(pts / 3)) % 24).padStart(2, "0") + "h";
      const ok = await perguntaRapida({ nivel: n, idx: k, tempo, titulo: `Plantão 12h · ${relog}`, contador: `${pts} pts · ${"♥".repeat(vidas)}${"♡".repeat(3 - vidas)}` });
      if (ok) { pts++; S.xp += 20; } else if (--vidas <= 0) break;
    }
    const recorde = pts > (S.rec12 || 0);
    S.rec12 = Math.max(S.rec12 || 0, pts);
    const nb = unlock([pts >= 24 && "ferro"].filter(Boolean));
    save();
    go({ name: "dozefim", pts, recorde, vidas, novos: nb.map(b => b.id) });
  };
}

/* ---------- sheets, toast, confetti ---------- */
let scrim = null;
function openSheet(html, closable) {
  closeSheet(true);
  scrim = document.createElement("div"); scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  if (closable === "tap") scrim.onclick = e => { if (e.target === scrim) closeSheet(); };
  document.body.appendChild(scrim);
}
function closeSheet(silent) { if (scrim) { scrim.remove(); scrim = null; } if (!silent && evalCtl) { evalCtl.abort(); evalCtl = null; } if (!silent) TTS.stop(); }

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `${BADGE_SVG("#F6C453", "M11 16l3.5 3.5L21 13").replace("<svg", '<svg width="20" height="20"')}<span>${esc(msg)}</span>`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function confetti(big) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"); cv.hidden = false; const ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#58E08A", "#3CD3F0", "#F4CF4A", "#FF7E7E", "#F6C453"];
  const ps = Array.from({ length: big ? 160 : 70 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .55, vx: (Math.random() - .5) * 9, vy: -Math.random() * 13 - 5, s: Math.random() * 6 + 4, r: Math.random() * 6, c: cols[Math.random() * 5 | 0] }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(loop); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}

    <div class="field"><label class="label" for="s-rate">Velocidade da voz</label>

    <div class="field"><label class="label" for="s-livre">Níveis</label>
      <select id="s-livre"><option value="0">Liberar em sequência (modo jogo)</option><option value="1" ${S.cfg.livre ? "selected" : ""}>Liberar todos agora</option></select></div>
    <div class="field"><label class="label" for="s-auto">Narrar caso automaticamente</label>
      <select id="s-auto"><option value="1">Sim</option><option value="0" ${S.cfg.autoVoz ? "" : "selected"}>Não</option></select></div>
    <div class="actions">
      <button class="btn primary" id="s-save">Salvar</button>
      <button class="btn ghost" style="flex:1" id="s-test">${ICON.speaker}Testar voz</button>
      <button class="btn ghost" style="flex:1;color:var(--bad)" id="s-reset">Zerar progresso</button>
    </div>`, "tap");
  $("#s-model").value = S.cfg.model;
  const setVoz = () => { const v = $("#s-voice").value; S.cfg.vozGravada = v === "__gravada"; S.cfg.voice = v === "__gravada" ? "" : v; S.cfg.rate = +$("#s-rate").value; };
  $("#s-test").onclick = () => { setVoz(); TTS.say("fx-teste"); };
  let armed = false;
  $("#s-reset").onclick = e => {
    if (!armed) { armed = true; e.currentTarget.textContent = "Toque de novo para confirmar"; return; }
    const cfg = S.cfg, nome = S.nome; S = blank(); S.cfg = cfg; S.nome = nome; S._askedName = true; save(); closeSheet(); go({ name: "home" }); toast("Progresso zerado");
  };
  $("#s-save").onclick = () => {
    S.nome = $("#s-nome").value.trim().slice(0, 30);
    S.cfg.apiKey = $("#s-key").value.trim(); S.cfg.model = $("#s-model").value;
    setVoz(); S.cfg.livre = $("#s-livre").value === "1"; S.cfg.autoVoz = $("#s-auto").value === "1";
    save(); closeSheet(); render(); toast(S.cfg.apiKey ? "Salvo · avaliação por IA ativa" : "Salvo");
  };
}
